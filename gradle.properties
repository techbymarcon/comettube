android.useAndroidX=true
android.enableJetifier=false

# Memory tuning to fit comfortably without trigger OOM killer
org.gradle.jvmargs=-Xmx900m -XX:MaxMetaspaceSize=384m -XX:+UseG1GC
org.gradle.parallel=false
org.gradle.workers.max=1

# Kotlin daemon memory limit
kotlin.daemon.jvmargs=-Xmx400m -XX:MaxMetaspaceSize=200m
kotlin.compiler.execution.strategy=in-process

# Many modules reference cross-package R fully-qualified; keep the transitive R class.
android.nonTransitiveRClass=false
